services:
  - type: web
    name: elimfilters-linkedin-bot
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: LINKEDIN_CLIENT_ID
        value: "866h35ln0x9989"
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_ACCESS_TOKEN
        sync: false
      - key: LINKEDIN_ORGANIZATION_ID
        value: "133064152"
      - key: LINKEDIN_VERIFY_TOKEN
        sync: false
      - key: LINKEDIN_API_VERSION
        value: "202606"
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: KNOWLEDGE_BASE_URL
        sync: false
      - key: DRY_RUN
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: elimfilters-instagram-db
          property: connectionString
